<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Release Notes</title>
<style>
  :root {
    --color-bg: #0a0a0f;
    --color-bg-card: #16161f;
    --color-border: #1e1e2e;
    --color-text: #e4e4e7;
    --color-text-secondary: #a1a1aa;
    --color-accent-light: #8b5cf6;
  }
  body {
    margin: 0;
    padding: 2.5rem 1.5rem;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
  }
  .back-link {
    display: inline-block;
    margin-bottom: 1.5rem;
    color: var(--color-text-secondary);
    text-decoration: none;
    font-size: 0.9rem;
  }
  .back-link:hover {
    color: var(--color-accent-light);
  }
  h1 {
    font-size: 1.75rem;
    margin-bottom: 0.25rem;
  }
  .subtitle {
    color: var(--color-text-secondary);
    margin-bottom: 2.5rem;
  }
  .release {
    background: var(--color-bg-card);
    border: 1px solid var(--color-border);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.25rem;
  }
  .release h2 {
    font-size: 1.125rem;
    margin: 0 0 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--color-accent-light);
  }
  .release .date {
    color: var(--color-text-secondary);
    font-weight: 400;
    font-size: 0.85rem;
  }
  .release ul {
    margin: 0;
    padding-left: 1.25rem;
  }
  .release li {
    margin-bottom: 0.4rem;
  }
  .release li:last-child {
    margin-bottom: 0;
  }
  .index-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .index-list li {
    margin-bottom: 0.75rem;
  }
  .index-list a {
    display: block;
    background: var(--color-bg-card);
    border: 1px solid var(--color-border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    color: var(--color-text);
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
  }
  .index-list a:hover {
    border-color: var(--color-accent-light);
  }
  .index-list .range {
    color: var(--color-accent-light);
  }
  .index-list .meta {
    display: block;
    margin-top: 0.25rem;
    color: var(--color-text-secondary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <a class="back-link" href="../">&larr; Aleph Virux</a>
  <h1>Release Notes</h1>
  <p class="subtitle">Pick a version range to see what changed.</p>
  <ul class="index-list">
    <li>
      <a href="Virux-AUv3-0.1.101-to-0.1.103.html">
        <span class="range">Virux-AUv3 0.1.101 &ndash; 0.1.103</span>
        <span class="meta">2 releases &middot; latest 2026-09-21</span>
      </a>
    </li>
    <li>
      <a href="Virux-AUv3-0.1.89-to-0.1.101.html">
        <span class="range">Virux-AUv3 0.1.89 &ndash; 0.1.101</span>
        <span class="meta">10 releases &middot; latest 2026-09-15</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
